name: TMP Debug Fetch Logs

on:
  push:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  show-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Find last failed Build & Push run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="Build & Push Docker image (GHCR)")][0].id')
          echo "RUN_ID=$RUN_ID"
          JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name=="Build & Push")][0].id')
          echo "JOB_ID=$JOB_ID"
          gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" > /tmp/job.log || true
          echo "=== log size: $(wc -c < /tmp/job.log) bytes ==="
          echo "=== ERROR LINES ==="
          grep -n -i -E "error|fail|ERR_|not found|denied|panic|unable|invalid" /tmp/job.log | tail -n 80 || true

  reproduce-ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce Dockerfile UI stage
        run: |
          set -x
          corepack enable
          pnpm --version
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build-only
          ls -la dist | head -20
