name: TMP Debug Fetch Logs

on:
  push:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  show-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Find last failed Build & Push run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="Build & Push Docker image (GHCR)")][0].id')
          echo "RUN_ID=$RUN_ID"
          JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name=="Build & Push")][0].id')
          echo "JOB_ID=$JOB_ID"
          gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" > /tmp/job.log || true
          echo "=== log size: $(wc -c < /tmp/job.log) bytes ==="
          echo "=== ERROR LINES (with context) ==="
          grep -n -i -E "##\[error\]|ERROR:|error during|failed to|ERR_|not found|cannot|unable" /tmp/job.log | tail -n 40 || true
          echo "=== LAST 120 LINES OF THE FAILED JOB ==="
          tail -n 120 /tmp/job.log | sed -e 's/\x1b\[[0-9;]*m//g' || true

  reproduce-ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce Dockerfile UI stage
        run: |
          set -x
          corepack enable
          pnpm --version
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build-only
          ls -la dist | head -20

  reproduce-core-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Reproduce Dockerfile core stage exactly
        run: |
          set -x
          rm -rf static/frontend && mkdir -p static/frontend
          echo '<!doctype html><html><body>placeholder</body></html>' > static/frontend/index.html
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          BUILD_META="+$(date -u +%Y%m%d)"
          go build -trimpath \
            -ldflags "-s -w -X 'sealdice-core/dice.VERSION_BUILD_METADATA=${BUILD_META}'" \
            -o /tmp/sealdice-core . 2>&1 | tail -n 40
          echo "build exit=$?"
          ls -la /tmp/sealdice-core
          /tmp/sealdice-core --version
          echo "version exit=$?"

