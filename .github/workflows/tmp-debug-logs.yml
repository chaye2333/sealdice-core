name: TMP Debug Docker Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-verbose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build image without pushing, verbose
        run: |
          set +e
          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            --build-arg "VERSION_BUILD_METADATA=+$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)" \
            --load \
            -t localtest:latest . > /tmp/build.log 2>&1
          CODE=$?
          echo "=== docker build exit code: $CODE ==="
          echo "=== error lines ==="
          grep -n -i -E "error|failed|not found|cannot|unable|ERR_" /tmp/build.log | tail -n 60
          echo "=== tail 120 ==="
          tail -n 120 /tmp/build.log
          exit $CODE
