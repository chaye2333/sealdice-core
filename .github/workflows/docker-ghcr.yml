name: Build & Push Docker image (GHCR)

# 触发方式：
#   * 推送到 main 分支
#   * 打 v* 标签
#   * 在 Actions 页面手动触发
#
# 产物：ghcr.io/<你的GitHub用户名>/sealdice-core:latest
# 云服务器上用 docker pull 拉取即可，无需本地安装 Go / Node / GCC。

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR 的镜像名必须全小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先跑测试，测试不过就不构建镜像
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download modules
        run: go mod download

      # 测试环境不需要 CGO：仓库内已有 !cgo 的纯 Go SQLite 实现
      - name: Run tests
        env:
          CGO_ENABLED: '0'
        run: go test ./dice ./api -count=1

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Compute version metadata
        id: version
        # 注入到 dice.VERSION_BUILD_METADATA，格式必须是 +yyyyMMdd.短hash
        run: echo "meta=+$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_BUILD_METADATA=${{ steps.version.outputs.meta }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
