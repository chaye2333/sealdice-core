name: Build & Push Docker image (GHCR)

# 触发方式：
#   * 推送到 main 分支
#   * 打 v* 标签
#   * 在 Actions 页面手动触发
#
# 产物：ghcr.io/<你的GitHub用户名>/sealdice-core:latest
# 云服务器上用 docker pull 拉取即可，无需本地安装 Go / Node / GCC。

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR 的镜像名必须全小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先跑测试，测试不过就不构建镜像
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download modules
        run: go mod download

      # 测试环境不需要 CGO：仓库内已有 !cgo 的纯 Go SQLite 实现
      - name: Run tests
        env:
          CGO_ENABLED: '0'
        run: go test ./dice ./api -count=1

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Compute version metadata
        id: version
        # 注入到 dice.VERSION_BUILD_METADATA，格式必须是 +yyyyMMdd.短hash
        run: echo "meta=+$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_BUILD_METADATA=${{ steps.version.outputs.meta }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 烟雾测试：确认镜像里真的是海豹管理界面，而不是占位页或 Vue 脚手架样例页。
      # 历史上这里踩过坑——曾经误用了仓库的 ui/ 目录，结果镜像里是 Vite 欢迎页。
      #
      # 判定依据：真正的构建产物一定会引用外链的哈希资源（assets/index-*.js），
      # 而占位页 / 脚手架页都不满足，所以不看页面文案、只看资源引用，最不容易误判。
      - name: Smoke test the admin UI is bundled
        run: |
          set -e
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "verifying $IMAGE"
          docker run -d --name smktest -p 13211:3211 "$IMAGE"

          OK=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13211/ -o /tmp/page.html; then OK=1; break; fi
            sleep 1
          done

          echo "--- container logs ---"
          docker logs smktest 2>&1 | head -30 || true
          echo "--- fetched index.html ---"
          cat /tmp/page.html 2>/dev/null || true
          echo

          fail() {
            echo "::error::$1"
            docker rm -f smktest || true
            exit 1
          }

          [ -n "$OK" ] || fail "无法访问容器首页，UI 可能没启动"
          grep -qi "not bundled in this checkout" /tmp/page.html && fail "镜像是用占位页编译的，前端没有打进去"
          grep -qi "Vite + Vue 3\|You've successfully created" /tmp/page.html && fail "镜像里打包的是 Vue 脚手架样例页，不是海豹管理界面"

          # 抽出首页引用的资源路径，确认它真实存在
          ASSET=$(grep -oE '(src|href)="[^"]*assets/[^"]+"' /tmp/page.html | head -n1 | sed -E 's/.*="([^"]*)".*/\1/' || true)
          if [ -z "$ASSET" ]; then
            fail "首页没有引用构建后的 assets 资源，前端可能不是正式构建产物"
          fi
          case "$ASSET" in
            /*) URL="http://127.0.0.1:13211$ASSET" ;;
            *)  URL="http://127.0.0.1:13211/$ASSET" ;;
          esac
          echo "checking asset: $URL"
          curl -fsS "$URL" -o /tmp/asset.js || fail "首页引用的资源 $ASSET 无法访问"
          echo "asset size: $(wc -c < /tmp/asset.js) bytes"

          # ---------------------------------------------------------------
          # 关键：确认镜像里是**我们 fork 的那份 UI**，而不是旧缓存里的老板本。
          #
          # 背景（真实踩过）：Dockerfile 里 `curl` 前端 tarball 那一层只依赖 UI_REF
          # 这个 ARG 的值。当年写成 "master" 时该值永远不变 → 层永远命中缓存 →
          # 之后所有 UI 改动都进不了镜像，而且构建照样成功，极难发现。
          # 现在 UI_REF 钉成 commit hash，这里再校验新 UI 的特征字符串，
          # 双保险：漏改 hash 会被这一步直接拦下。
          #
          # 为什么要拼接**所有** assets/*.js：Vite 会按路由/legacy 拆出多个 chunk，
          # 设置页的代码不一定在首页第一个 <script> 里。只 grep 第一个文件会两头出错：
          #   · 新字符串落在别的 chunk → 明明打对了却构建失败、不发布；
          #   · 该消失的旧字符串落在别的 chunk → 检查恒过（假绿）。
          # ---------------------------------------------------------------
          echo "--- collecting all js assets referenced by the page ---"
          : > /tmp/all_assets.js
          grep -oE 'assets/[A-Za-z0-9._/-]+\.js' /tmp/page.html | sort -u > /tmp/asset_list.txt || true
          ASSET_COUNT=0
          while read -r A; do
            [ -n "$A" ] || continue
            if curl -fsS "http://127.0.0.1:13211/$A" >> /tmp/all_assets.js 2>/dev/null; then
              ASSET_COUNT=$((ASSET_COUNT + 1))
            fi
          done < /tmp/asset_list.txt
          echo "collected $ASSET_COUNT js assets, $(wc -c < /tmp/all_assets.js) bytes"
          if [ ! -s /tmp/all_assets.js ]; then
            fail "没能取到任何 js 产物，无法校验前端版本"
          fi

          echo "--- checking the bundled UI really contains our settings ---"

          # 应当存在的：本 fork 新增的绑定设置
          for NEEDLE in identityBindPreferEmailCode identityBindCodeExpireSec logMultiBotDedupWindowSec; do
            if ! grep -q "$NEEDLE" /tmp/all_assets.js; then
              fail "镜像里的 UI 缺少设置项 $NEEDLE —— 前端可能是旧缓存版本（检查 Dockerfile 的 UI_REF 是否匹配 sealdice-ui fork 的最新 commit）"
            fi
          done

          # 应当已删除的：答题时代的失效选项
          for GONE in identityBindQuestionCount identityBindKeepQuiz identityBindFailCooldownSec; do
            if grep -q "$GONE" /tmp/all_assets.js; then
              fail "镜像里的 UI 仍包含已废弃的选项 $GONE —— 前端是旧版本"
            fi
          done

          echo "OK: 前端是 fork 的最新版本（含新设置项、已无废弃选项）"
          echo "OK: 管理界面已正确打包（资源 $ASSET 可用）"
          docker rm -f smktest
