name: Build & Push Docker image (GHCR)

# 触发方式：
#   * 推送到 main 分支
#   * 打 v* 标签
#   * 在 Actions 页面手动触发
#
# 产物：ghcr.io/<你的GitHub用户名>/sealdice-core:latest
# 云服务器上用 docker pull 拉取即可，无需本地安装 Go / Node / GCC。

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR 的镜像名必须全小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先跑测试，测试不过就不构建镜像
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download modules
        run: go mod download

      # 测试环境不需要 CGO：仓库内已有 !cgo 的纯 Go SQLite 实现
      - name: Run tests
        env:
          CGO_ENABLED: '0'
        run: go test ./dice ./api -count=1

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Compute version metadata
        id: version
        # 注入到 dice.VERSION_BUILD_METADATA，格式必须是 +yyyyMMdd.短hash
        run: echo "meta=+$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_BUILD_METADATA=${{ steps.version.outputs.meta }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 烟雾测试：确认镜像里跑的是「仓库内 ui/ 的构建产物」，而不是占位页/脚手架页。
      #
      # 路由约定（见 ui_router.go）：`/` 默认 302 到 /v2ui/（新版 UI），
      # /old-ui/ 只是回退入口（镜像里通常只有占位页），所以检查一律打到 /v2ui/。
      #
      # 内容校验必须覆盖**全部** chunk：Vite 按路由拆包，设置页在
      # base-setting-*.js 这类懒加载 chunk 里，只看首页引用的 <script> 会两头出错
      # （新字符串落在别的 chunk → 明明打对了却失败；旧字符串落别处 → 假绿）。
      # chunk 清单从 PWA 的 sw.js（precache manifest）取，首页引用列表作兜底。
      - name: Smoke test the admin UI is bundled
        run: |
          set -e
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "verifying $IMAGE"
          docker run -d --name smktest -p 13211:3211 "$IMAGE"

          fail() {
            echo "::error::$1"
            docker logs smktest 2>&1 | tail -40 || true
            docker rm -f smktest || true
            exit 1
          }

          OK=""
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:13211/v2ui/; then OK=1; break; fi
            sleep 1
          done
          [ -n "$OK" ] || fail "打不开 /v2ui/，新 UI 没有打包进镜像"

          echo "--- container logs ---"
          docker logs smktest 2>&1 | head -30 || true

          # 1) 根路径必须重定向到新版 UI
          ROOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13211/ || true)
          ROOT_LOC=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:13211/ || true)
          echo "root: $ROOT_CODE -> $ROOT_LOC"
          [ "$ROOT_CODE" = "302" ] || fail "根路径应当 302 到新版 UI，实际 $ROOT_CODE（可能还是占位页/老镜像）"
          case "$ROOT_LOC" in
            */v2ui/) ;;
            *) fail "根路径重定向目标异常：$ROOT_LOC" ;;
          esac

          # 2) 新版首页不是占位页、不是 Vue 脚手架样例
          curl -fsS http://127.0.0.1:13211/v2ui/ -o /tmp/page.html || fail "取不到 /v2ui/ 首页"
          echo "--- fetched /v2ui/ ---"
          cat /tmp/page.html
          echo
          grep -qi "V2 UI not built" /tmp/page.html && fail "镜像里是 v2ui 占位页，dist 没有打进去"
          grep -qi "Vite + Vue 3\|You've successfully created" /tmp/page.html && fail "镜像里打包的是 Vue 脚手架样例页"

          ASSET=$(grep -oE '(src|href)="[^"]*assets/[^"]+"' /tmp/page.html | head -n1 | sed -E 's/.*="([^"]*)".*/\1/' || true)
          [ -n "$ASSET" ] || fail "首页没有引用 assets 资源，前端不是正式构建产物"
          case "$ASSET" in
            http*) URL="$ASSET" ;;
            /*)    URL="http://127.0.0.1:13211$ASSET" ;;
            *)     URL="http://127.0.0.1:13211/v2ui/$ASSET" ;;
          esac
          echo "checking asset: $URL"
          curl -fsS "$URL" -o /tmp/asset.js || fail "首页引用的资源 $ASSET 无法访问"
          echo "asset size: $(wc -c < /tmp/asset.js) bytes"

          # 3) 用 sw.js 的 precache 清单枚举全部 chunk（拿不到时退回首页引用列表）
          grep -oE 'assets/[A-Za-z0-9._/-]+\.js' /tmp/page.html | sort -u > /tmp/asset_list.txt || true
          if curl -fsS http://127.0.0.1:13211/v2ui/sw.js -o /tmp/sw.js; then
            grep -oE 'assets/[A-Za-z0-9._/-]+\.js' /tmp/sw.js | sort -u >> /tmp/asset_list.txt || true
          else
            echo "warn: 取不到 sw.js，只用首页引用的 chunk 校验"
          fi
          sort -u /tmp/asset_list.txt -o /tmp/asset_list.txt
          echo "chunk 清单：$(wc -l < /tmp/asset_list.txt) 个"

          : > /tmp/all_assets.js
          ASSET_COUNT=0
          while read -r A; do
            [ -n "$A" ] || continue
            if curl -fsS "http://127.0.0.1:13211/v2ui/$A" >> /tmp/all_assets.js 2>/dev/null; then
              ASSET_COUNT=$((ASSET_COUNT + 1))
            fi
          done < /tmp/asset_list.txt
          echo "collected $ASSET_COUNT js assets, $(wc -c < /tmp/all_assets.js) bytes"
          [ -s /tmp/all_assets.js ] || fail "没能取到任何 js 产物，无法校验前端版本"

          # 4) 本 fork 的设置项必须在（含懒加载的设置页 chunk）
          for NEEDLE in identityBindEnable identityBindPreferEmailCode identityBindCodeExpireSec \
                        logMultiBotDedupWindowSec officialQQRequestTimeoutSec \
                        censorMaskEnable imageRenderEnable chat-console; do
            grep -q "$NEEDLE" /tmp/all_assets.js || fail "镜像里的 UI 缺少设置项 $NEEDLE —— 新 UI 编译产物不对或没有嵌入"
          done

          # 5) 已废弃的选项必须不在
          for GONE in identityBindQuestionCount identityBindKeepQuiz identityBindFailCooldownSec; do
            grep -q "$GONE" /tmp/all_assets.js && fail "镜像里的 UI 仍包含已废弃的选项 $GONE —— 前端是旧版本"
          done

          echo "OK: 默认入口指向 /v2ui/，且前端是当前仓库 ui/ 的最新构建"
          docker rm -f smktest

