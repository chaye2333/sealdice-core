name: TMP Race Test Diagnose

on:
  push:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  show-race-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Locate the failed Test & Lint run and print it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.name=="Test & Lint")][0].id')
          echo "RUN_ID=$RUN_ID"
          JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name=="Test & Lint")][0].id')
          echo "JOB_ID=$JOB_ID"
          gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" > /tmp/job.log || true
          echo "=== log size: $(wc -c < /tmp/job.log) ==="
          echo "=== FAIL / RACE lines ==="
          grep -n -E "^FAIL|^--- FAIL|DATA RACE|panic:|\.go:[0-9]+:" /tmp/job.log | head -n 80 || true
          echo "=== tail 150 ==="
          tail -n 150 /tmp/job.log || true
